apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dinolab-staging-test
  namespace: monitoring
spec:
  secretName: dinolab-staging-test-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - prometheus.dinolab.space
