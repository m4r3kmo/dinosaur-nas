replicaCount: 1

crds:
  enabled: true
  keep: true

prometheus:
  enabled: true

  servicemonitor:
    enabled: true
    prometheusInstance: monitoring
    interval: 30s
    labels:
      release: monitoring

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

webhook:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cainjector:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi