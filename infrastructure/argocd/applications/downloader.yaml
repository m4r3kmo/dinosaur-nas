apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dinosaur-downloader
  namespace: argocd
spec:
  project: dinosaur-media

  source:
    repoURL: https://github.com/m4r3kmo/dinosaur-nas.git
    targetRevision: main
    path: apps/downloader

    helm:
      releaseName: dinosaur-downloader
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
