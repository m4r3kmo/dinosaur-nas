apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dinosaur-argocd
  namespace: argocd
spec:
  secretName: dinosaur-argocd-tls

  duration: 2160h
  renewBefore: 720h

  dnsNames:
    - argocd.dinosaur.lan

  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always

  usages:
    - digital signature
    - key encipherment
    - server auth

  issuerRef:
    name: dinosaur-ca
    kind: ClusterIssuer
    group: cert-manager.io
