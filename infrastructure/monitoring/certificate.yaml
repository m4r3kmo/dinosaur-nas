apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dinosaur-monitoring
  namespace: monitoring
spec:
  secretName: dinosaur-monitoring-tls

  duration: 2160h
  renewBefore: 720h

  dnsNames:
    - grafana.dinosaur.lan
    - prometheus.dinosaur.lan
    - alertmanager.dinosaur.lan

  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always

  usages:
    - digital signature
    - key encipherment
    - server auth

  issuerRef:
    name: dinosaur-ca
    kind: ClusterIssuer
    group: cert-manager.io
