{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: dinosaur-downloader

spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint | quote }}

  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule

      middlewares:
        - name: dinosaur-downloader-auth

      services:
        - name: dinosaur-downloader
          port: {{ .Values.service.port }}

  tls:
    secretName: {{ .Values.ingress.tls.existingSecret | quote }}
{{- end }}