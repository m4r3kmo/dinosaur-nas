{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dinosaur-streaming-catalogs
  namespace: {{ .Release.Namespace }}
  labels:
    app: dinosaur-downloader
    release: {{ .Values.monitoring.release | quote }}

spec:
  groups:
    - name: dinosaur.streaming.catalogs
      rules:

        - alert: DinosaurStreamingMetricsUnavailable
          expr: |
            absent(
              dinosaur_streaming_catalog_database_present{
                namespace="media",
                service="dinosaur-downloader"
              }
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Dinosaur streaming metrics unavailable"
            description: "Streaming metrics have been unavailable for 10 minutes."

{{- if and .Values.availabilityScanner.enabled (not .Values.availabilityScanner.suspend) }}

        - alert: DinosaurStreamingDatabaseMissing
          expr: |
            dinosaur_streaming_catalog_database_present == 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Streaming catalog database missing"
            description: "The streaming catalog database has not been created."

        - alert: DinosaurStreamingCatalogNotInitialized
          expr: |
            dinosaur_streaming_catalog_initialized == 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Streaming catalog not initialized"
            description: '{{ "{{" }} $labels.provider {{ "}}" }} / {{ "{{" }} $labels.media_type {{ "}}" }} has no baseline.'

        - alert: DinosaurStreamingScannerJobFailed
          expr: |
            (
              kube_job_failed{
                namespace="media",
                condition="true"
              } == 1
            )
            and on (namespace, job_name)
            topk(
              1,
              max by (namespace, job_name) (
                kube_job_created{namespace="media"}
              )
              and on (namespace, job_name)
              (
                kube_job_owner{
                  namespace="media",
                  owner_kind="CronJob",
                  owner_name="dinosaur-availability-scanner"
                } == 1
              )
            )
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Dinosaur streaming scanner failed"
            description: 'Scanner job {{ "{{" }} $labels.job_name {{ "}}" }} has failed.'

        - alert: DinosaurStreamingCatalogStale
          expr: |
            (
              time() -
              dinosaur_streaming_catalog_last_success_timestamp_seconds
              > 93600
            )
            and
            (
              time() -
              dinosaur_streaming_catalog_last_success_timestamp_seconds
              <= 172800
            )
            and
            (
              dinosaur_streaming_catalog_initialized == 1
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Streaming catalog scan overdue"
            description: '{{ "{{" }} $labels.provider {{ "}}" }} / {{ "{{" }} $labels.media_type {{ "}}" }} has not been scanned for more than 26 hours.'

        - alert: DinosaurStreamingCatalogCritical
          expr: |
            (
              time() -
              dinosaur_streaming_catalog_last_success_timestamp_seconds
              > 172800
            )
            and
            (
              dinosaur_streaming_catalog_initialized == 1
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Streaming catalog scan critically overdue"
            description: '{{ "{{" }} $labels.provider {{ "}}" }} / {{ "{{" }} $labels.media_type {{ "}}" }} has not been scanned for more than 48 hours.'

{{- end }}

{{- if .Values.csfd.enabled }}

    - name: dinosaur.csfd.api
      rules:

        - alert: DinosaurCZDBQuotaWarning
          expr: |
            (
              dinosaur_csfd_requests_last_24h{
                namespace="media",
                service="dinosaur-downloader"
              }
              /
              dinosaur_csfd_request_limit{
                namespace="media",
                service="dinosaur-downloader"
              }
              >= 0.8
            )
            and
            (
              dinosaur_csfd_requests_last_24h{
                namespace="media",
                service="dinosaur-downloader"
              }
              <
              dinosaur_csfd_request_limit{
                namespace="media",
                service="dinosaur-downloader"
              }
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Dinosaur CZDB API quota warning"
            description: "At least 80 percent of the internal rolling 24h CZDB API quota has been consumed."

        - alert: DinosaurCZDBQuotaExhausted
          expr: |
            dinosaur_csfd_requests_last_24h{
              namespace="media",
              service="dinosaur-downloader"
            }
            >=
            dinosaur_csfd_request_limit{
              namespace="media",
              service="dinosaur-downloader"
            }
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Dinosaur CZDB API quota exhausted"
            description: "Internal CZDB API quota exhausted. Cached ratings remain available."

        - alert: DinosaurCZDBRateLimited
          expr: |
            increase(
              dinosaur_csfd_api_429_total{
                namespace="media",
                service="dinosaur-downloader"
              }[15m]
            ) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Dinosaur CZDB API rate limited"
            description: "CZDB returned HTTP 429 within the last 15 minutes."

        - alert: DinosaurCZDBMetricsUnavailable
          expr: |
            absent(
              dinosaur_csfd_metrics_up{
                namespace="media",
                service="dinosaur-downloader"
              }
            )
            or
            (
              dinosaur_csfd_metrics_up{
                namespace="media",
                service="dinosaur-downloader"
              } == 0
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Dinosaur CZDB metrics unavailable"
            description: "CZDB metrics have been missing or unhealthy for 10 minutes."

{{- end }}
{{- end }}
