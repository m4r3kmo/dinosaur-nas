apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: dinosaur-downloader-state

  annotations:
    helm.sh/resource-policy: keep

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: {{ .Values.persistence.state.storageClass }}

  resources:
    requests:
      storage: {{ .Values.persistence.state.size }}