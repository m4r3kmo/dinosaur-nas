{{- if .Values.ingress.enabled }}
{{- with .Values.ingress.dinolab }}
{{- if .enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dinosaur-downloader-dinolab
spec:
  entryPoints:
    - {{ $.Values.ingress.entryPoint | quote }}
  routes:
    - match: Host(`{{ .host }}`)
      kind: Rule
      middlewares:
        - name: dinosaur-downloader-auth
      services:
        - name: dinosaur-downloader
          port: {{ $.Values.service.port }}
  tls:
    secretName: {{ .tls.existingSecret | quote }}
{{- end }}
{{- end }}
{{- end }}
