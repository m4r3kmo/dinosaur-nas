replicaCount: 1

downloadWorkers: 3

image:
  repository: localhost/dinosaur-downloader
  tag: "0.6.3"
  pullPolicy: Never

credentials:
  existingSecret: downloader-credentials

service:
  type: ClusterIP
  port: 8085

prometheus:
  url: http://dinosaur-monitoring-prometheus.monitoring.svc.cluster.local:9090

jellyfin:
  url: http://jellyfin.media.svc.cluster.local:8096

persistence:
  state:
    storageClass: local-path
    size: 1Gi

  media:
    existingClaim: dinosaur-media-pvc
    mountPath: /mnt/storage/media

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

nodeSelector:
  kubernetes.io/hostname: dinosaur

ingress:
  enabled: true
  host: download.dinosaur.lan

  entryPoint: websecure

  tls:
    existingSecret: dinosaur-wildcard-managed-tls

  dinolab:
    enabled: true
    host: download.dinolab.space
    tls:
      existingSecret: dinolab-media-tls

  auth:
    existingSecret: downloader-web-auth
    realm: Dinosaur NAS
availabilityScanner:
  enabled: true
  suspend: false

  schedule: "0 6 * * *"
  timeZone: Europe/Bratislava

  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  activeDeadlineSeconds: 1800

  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  backoffLimit: 0

  credentials:
    existingSecret: dinosaur-discover-credentials

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

monitoring:
  enabled: true
  release: monitoring
  interval: 60s
  scrapeTimeout: 10s

csfd:
  enabled: true
  existingSecret: dinosaur-czdb-credentials
