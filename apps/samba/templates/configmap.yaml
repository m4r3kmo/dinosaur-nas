apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  smb.conf: |
    [global]
        workgroup = WORKGROUP
        server string = Dinosaur NAS
        server role = standalone server
        security = user
        map to guest = Never
        server min protocol = SMB2_02
        server max protocol = SMB3
        server signing = mandatory
        smb ports = 445

        load printers = no
        disable spoolss = yes
        printing = bsd
        printcap name = /dev/null

        wide links = no
        follow symlinks = no

    [{{ .Values.samba.shareName }}]
        path = /shared
        browseable = yes
        read only = no
        guest ok = no
        valid users = {{ .Values.samba.username }}
        create mask = 0664
        directory mask = 0775
